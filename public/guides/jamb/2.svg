<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative JAMB NIN verification screen</title>
  <desc id="desc">A wireframe showing where the SMS shortcode instruction appears during NIN verification.</desc>
  <rect width="1280" height="800" fill="#F5F5F0"/>
  <rect x="64" y="50" width="1152" height="700" rx="18" fill="#FFFFFF" stroke="#D9D9D1" stroke-width="2"/>
  <path d="M64 116h1152" stroke="#D9D9D1" stroke-width="2"/>
  <circle cx="104" cy="83" r="8" fill="#D6D6CF"/>
  <circle cx="132" cy="83" r="8" fill="#D6D6CF"/>
  <circle cx="160" cy="83" r="8" fill="#D6D6CF"/>
  <rect x="256" y="68" width="520" height="30" rx="7" fill="#F2F2EC"/>
  <text x="278" y="89" font-family="Arial, sans-serif" font-size="14" fill="#77776F">Illustrative registration screen</text>
  <rect x="64" y="116" width="1152" height="78" fill="#242A18"/>
  <text x="112" y="164" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Registration</text>
  <text x="1057" y="164" font-family="Arial, sans-serif" font-size="17" fill="#E7E8D9">Help</text>
  <text x="170" y="276" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#242A18">Verify your NIN</text>
  <text x="170" y="314" font-family="Arial, sans-serif" font-size="19" fill="#63635E">Confirm your phone number before continuing.</text>
  <rect x="170" y="350" width="300" height="55" rx="7" fill="#FFFFFF" stroke="#BEBEB5" stroke-width="2"/>
  <text x="193" y="385" font-family="Arial, sans-serif" font-size="17" fill="#71716A">0800 000 0000</text>
  <rect x="358" y="320" width="564" height="104" rx="10" fill="#F7F5DA" stroke="#CBC889" stroke-width="2"/>
  <text x="390" y="359" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#242A18">Send your NIN by SMS</text>
  <text x="390" y="393" font-family="Arial, sans-serif" font-size="16" fill="#4F4F49">Use the shortcode displayed on the official screen.</text>
  <rect x="170" y="485" width="232" height="52" rx="7" fill="#242A18"/>
  <text x="220" y="518" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">I have sent it</text>
  <rect x="1000" y="255" width="130" height="270" rx="18" fill="#242A18"/>
  <rect x="1011" y="278" width="108" height="205" rx="5" fill="#FFFFFF"/>
  <text x="1024" y="309" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#242A18">Messages</text>
  <rect x="1022" y="329" width="82" height="45" rx="8" fill="#E8E9DD"/>
  <text x="1030" y="348" font-family="Arial, sans-serif" font-size="8" fill="#242A18">Your NIN</text>
  <text x="1030" y="361" font-family="Arial, sans-serif" font-size="8" fill="#242A18">(11 digits)</text>
  <rect x="1022" y="400" width="82" height="20" rx="7" fill="#F2F2EC"/>
  <circle cx="1065" cy="503" r="8" fill="#75756E"/>
  <text x="170" y="630" font-family="Arial, sans-serif" font-size="16" fill="#77776F">Do not share your NIN with anyone other than official channels.</text>
</svg>
